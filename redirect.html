<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BashLearn теперь BashStart — Перенаправление</title>

    <meta http-equiv="refresh" content="2; url=https://github.io" />
    
    <link rel="canonical" href="https://github.io" />

    <style>
        @import url('https://tildacdn.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tilda Sans', 'Inter', sans-serif;
            background-color: #c8ffda;
            color: #20753D;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .redirect-card {
            background: #FFFFFF;
            max-width: 480px;
            width: 100%;
            padding: 45px 35px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(32, 117, 61, 0.12);
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            color: #20753D;
            margin-bottom: 16px;
            display: inline-block;
            text-decoration: none;
        }

        .logo span {
            color: #52D47A;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        p {
            font-size: 16px;
            opacity: 0.85;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .loader {
            width: 36px;
            height: 36px;
            border: 4px solid #c8ffda;
            border-top-color: #52D47A;
            border-radius: 50%;
            margin: 0 auto 28px;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn {
            display: inline-block;
            background-color: #52D47A;
            color: #FFFFFF;
            font-weight: 700;
            font-size: 16px;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.2s;
        }

        .btn:hover {
            background-color: #20753D;
            transform: translateY(-2px);
        }
    </style>

    <script>
        setTimeout(function () {
            window.location.replace("https://adil-master.github.io/BashStart/");
        }, 1500);
    </script>
</head>
<body>

    <div class="redirect-card">
        <div class="logo">Bash<span>Start</span></div>
        <h1>Мы переехали на новый адрес!</h1>
        <p>Проект BashLearn обновился и теперь называется <strong>BashStart</strong>. Сейчас вы будете автоматически перенаправлены...</p>
        
        <div class="loader"></div>
        
        <a href="https://adil-master.github.io/BashStart/" class="btn">Перейти сейчас</a>
    </div>

</body>
</html>
